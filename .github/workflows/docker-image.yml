name: Docker (build, test, publish)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only when we intend to push (no login needed for PR build)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main/tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test the image we just built.
      # On PRs, we don't push; we load locally and run.
      - name: Build (PR-only) to local Docker for testing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/ufc-predictor:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          IMAGE="local/ufc-predictor:pr"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # For main/tags we can test the pushed image tag "sha-<short>" is included by metadata-action,
            # but easiest is to test the local build output if present.
            # We'll just run the "latest" tag on main, otherwise the first tag.
            IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          fi

          docker rm -f ufc-predictor-test >/dev/null 2>&1 || true
          docker run -d --name ufc-predictor-test -p 5000:5000 "$IMAGE"

          # Wait for health endpoint
          for i in {1..30}; do
            if curl -fsS "http://localhost:5000/api/health" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Container logs:"
          docker logs ufc-predictor-test || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ufc-predictor-test >/dev/null 2>&1 || true
